name: Mise à jour des horaires
on:
  schedule: [{ cron: '7 */3 * * *' }]   # filet de sécurité ; le vrai réveil vient de Cloudflare toutes les 30 min (worker/)
  workflow_dispatch:
permissions: { actions: write, contents: read }
concurrency: { group: update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node update.mjs
        env:
          CP_EMAIL: ${{ secrets.CP_EMAIL }}
          CP_PASSWORD: ${{ secrets.CP_PASSWORD }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      # GitHub coupe les tâches planifiées après 60 jours sans activité : on les réactive à chaque passage.
      - run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/update.yml/enable
        env: { GH_TOKEN: '${{ github.token }}' }
